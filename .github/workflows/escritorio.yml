name: Programa de escritorio (Windows)

# Arma el instalador .exe y lo deja en Releases.
# Se dispara a mano (Actions → Run workflow) o al subir una etiqueta escritorio-v1.0.0, escritorio-v1.0.1…
on:
  workflow_dispatch:
  push:
    tags:
      - 'escritorio-v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: escritorio

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: escritorio/src-tauri

      - name: Instalar herramientas de Tauri
        run: npm install

      - name: Íconos desde el logo
        run: npx tauri icon ../public/icons/pwa/icon-512.png

      - name: Armar instalador
        run: npx tauri build

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('escritorio-prueba-{0}', github.run_number) }}
          name: Gestión CC Design para Windows ${{ github.ref_name }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: escritorio/src-tauri/target/release/bundle/nsis/*.exe
